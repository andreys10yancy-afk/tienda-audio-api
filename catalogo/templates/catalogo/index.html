{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SonidoPro · Tienda de equipos de audio</title>
  <!-- Foundation (framework CSS) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.8.1/dist/css/foundation.min.css">
  <link rel="stylesheet" href="{% static 'catalogo/styles.css' %}">
</head>
<body>

  <!-- Barra superior -->
  <div class="top-bar tienda-bar">
    <div class="top-bar-left">
      <ul class="menu">
        <li class="menu-text marca">🎧 SonidoPro</li>
      </ul>
    </div>
    <div class="top-bar-right">
      <ul class="menu">
        <li><a href="/api/productos/" target="_blank">Ver API (JSON)</a></li>
      </ul>
    </div>
  </div>

  <div class="grid-container">

    <!-- Filtros -->
    <form id="filtros" class="callout filtros" autocomplete="off">
      <div class="grid-x grid-margin-x">
        <div class="cell medium-4">
          <label>Buscar
            <input type="text" id="q" placeholder="Ej: sony, monitoreo, dac…">
          </label>
        </div>
        <div class="cell medium-2 small-6">
          <label>Categoría
            <select id="categoria"><option value="">Todas</option></select>
          </label>
        </div>
        <div class="cell medium-2 small-6">
          <label>Marca
            <select id="marca"><option value="">Todas</option></select>
          </label>
        </div>
        <div class="cell medium-2 small-6">
          <label>Precio máx. (COP)
            <input type="number" id="precio_max" min="0" step="10000" placeholder="1500000">
          </label>
        </div>
        <div class="cell medium-2 small-6">
          <label>Ordenar por
            <select id="orden">
              <option value="nombre">Nombre</option>
              <option value="precio_asc">Precio ↑</option>
              <option value="precio_desc">Precio ↓</option>
              <option value="recientes">Más recientes</option>
            </select>
          </label>
        </div>
      </div>
      <div class="grid-x grid-margin-x align-middle">
        <div class="cell shrink">
          <input type="checkbox" id="disponible"><label for="disponible">Solo disponibles</label>
        </div>
        <div class="cell shrink">
          <input type="checkbox" id="destacado"><label for="destacado">Solo destacados</label>
        </div>
        <div class="cell auto text-right">
          <button type="button" class="button secondary" id="limpiar">Limpiar</button>
        </div>
      </div>
    </form>

    <p id="resumen" class="resumen"></p>
    <div id="estado" class="callout" hidden></div>

    <!-- Tarjetas de productos (se llenan con JS) -->
    <div id="productos" class="grid-x grid-margin-x small-up-1 medium-up-2 large-up-3"></div>

    <!-- Paginación -->
    <nav aria-label="Paginación">
      <ul class="pagination text-center" id="paginacion"></ul>
    </nav>
  </div>

  <!-- Modal de detalle (usa GET /api/productos/<id>/) -->
  <div class="reveal" id="modal-detalle" data-reveal>
    <div id="detalle-contenido"></div>
    <button class="close-button" data-close aria-label="Cerrar" type="button">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.8.1/dist/js/foundation.min.js"></script>
  <script src="{% static 'catalogo/app.js' %}"></script>
</body>
</html>
